# ae_maintainer.cfg — 기본 설정 (프로그램과 같은 폴더에 두면 적용됩니다)
#   · 인게임에서 이 파일을 그대로 내려받아 쓰세요:
#       wget -f https://raw.githubusercontent.com/ysw2003/ae-maintainer/main/ae_maintainer.cfg /home/ae_maintainer.cfg
#   · 이 파일이 없으면 프로그램이 첫 실행 때 같은 내용의 기본 파일을 자동으로 만들어 줍니다.
#   · 주석(#)과 빈 줄은 무시됩니다. 코드는 실행되지 않습니다(단순 key=value).

# 실행 모드: drive = OC가 직접 요청 / monitor = 읽기·표시만
mode=drive

# 요청 주기(초)
interval=60

# true = 관리 대상 슬롯의 유지기 자체 자동요청을 끄고 OC 단독으로 요청 (중복 방지)
# false = 유지기 자체 기능과 병행 (중복 요청 가능)
takeover=true

# 요청량 규칙
#   need  = min(배치, 부족분)      ※ 부족분을 넘지 않게 (권장)
#   batch = 배치 값 고정
#   fill  = 부족분을 배치 단위로 올림
batchMode=need

# true = 요청하지 않고 계산 결과만 표시
dryRun=false

# 아이템 이름(name) 매칭 실패 시 표시이름(label)으로 재검색
labelFallback=true

# 종료(Ctrl+C) 시 유지기 슬롯 enable 상태를 원래대로 복구
autoRestore=true

# ---- v1.2 추가 --------------------------------------------------------------

# AE CPU 가 같은 품목을 이미 제작 중이면 새 요청을 넣지 않음 (finalOutput 비교)
skipIfCrafting=true

# 유지기 자체가 그 슬롯을 작업 중(isDone=false)이면 건너뜀
skipIfMaintainer=true

# 위 판단에 activeItems/storedItems/pendingItems 까지 포함 (오탐 가능, 기본 꺼짐)
scanActiveItems=false

# 요청 후 이 초(기본 60) 안에 완료되지 않으면 요청을 중단하고 CPU 취소 시도 (0=끔)
requestTimeout=60

# 타임아웃 시 그 품목을 제작 중인 AE CPU 작업을 취소
cancelOnTimeout=true

# 중단 후 그 슬롯을 다시 요청하지 않을 시간(초). 0=즉시 재시도 가능
timeoutCooldown=0

# 화면에 다음 주기까지 남은 시간을 1초마다 표시
countdown=true

# ---- v2.0: 여러 유지기 ------------------------------------------------------

# 요약 화면 한 페이지에 보여줄 유지기 수
pageSize=10

# 자동 페이지 전환 간격(초). 0=전환 안 함
pageSeconds=10

# 0=모든 유지기 사용, N=앞에서 N대만 사용
maxMaintainers=0

# 보관량을 사이클당 1회 전체 조회(유지기가 많을 때 훨씬 빠름). 문제가 있으면 false
bulkQuery=true

# 유지기에 이름 붙이기 (어댑터 주소는 프로그램의 list/diag 출력에서 확인)
# name.36720bcd-d45b-4d00-bd93-02be64000db0=창고A
# name.91c0d7ee-1a2b-3c4d-5e6f-7a8b9c0d1e2f=기계부품

# 특정 유지기 1대만 쓰고 싶을 때 어댑터 주소 지정 (비워두면 전부 사용)
# maintainerAddress=aaaa-1111-bbbb-2222

# ME Controller/Interface 가 여러 개일 때 어댑터 주소 지정
# controllerAddress=cccc-3333-dddd-4444
